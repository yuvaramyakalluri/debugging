<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — CampusCafe</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="stylesheet" href="../styles/theme.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>CampusCafe Checkout</h1>
      <p>Review your order &amp; apply student promo</p>
    </div>
    <a href="../index.html" class="btn btn-secondary">← Back to Menu</a>
  </header>

  <main class="checkout-wrapper">
    <section class="checkout-box">
      <h2>Order Summary</h2>
      <ul id="checkout-items" class="cart-list"></ul>

      <div class="promo-row">
        <input type="text" id="promo-input" placeholder="Promo code (e.g. STUDENT15)" />
        <button id="apply-promo-btn" type="button" class="btn btn-secondary">Apply</button>
      </div>
      <p id="promo-msg" class="msg-error"></p>

      <div class="summary-row">
        <span>Subtotal</span>
        <span>₹<span id="subtotal">0.00</span></span>
      </div>
      <div class="summary-row">
        <span>GST (5%)</span>
        <span>₹<span id="tax">0.00</span></span>
      </div>
      <div class="summary-row">
        <span>Discount</span>
        <span>-₹<span id="discount">0.00</span></span>
      </div>
      <div class="summary-row summary-total">
        <span>Grand Total</span>
        <span>₹<span id="grand-total">0.00</span></span>
      </div>
    </section>

    <section class="checkout-box">
      <h2>Student Details</h2>
      <form id="order-form">
        <div class="form-group">
          <label for="student-name">Full Name</label>
          <input type="text" id="student-name" placeholder="Enter your name" />
        </div>
        <div class="form-group">
          <label for="roll-number">Roll Number</label>
          <input type="text" id="roll-number" placeholder="e.g. CS2026-042" />
        </div>
        <p id="order-msg" class="msg-error"></p>
        <button type="submit" id="confirm-order-btn" class="btn btn-primary" style="width: 100%;">
          Confirm Order
        </button>
      </form>
    </section>
  </main>

  <script src="../scripts/checkout.js"></script>
</body>
</html>
